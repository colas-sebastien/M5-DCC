<!DOCTYPE html>
<html>
<head>
    <title>HTML Uploader</title>
</head>
<body>
	<center>
        <header>
            <h1>HTML Uploader</h1>
        </header>
        <div>
            <p style="text-align: left">Use this page to upload new files to the ESP8266.</p>
            <form method="post" enctype="multipart/form-data" style="margin: 0px auto 8px auto" >
                <input type="file" name="Choose file">
                <input class="button" type="submit" value="Upload" name="submit">
            </form>            
        </div>
	</center>
</body>
</html>
